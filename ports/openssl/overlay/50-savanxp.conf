## SavanXP target for OpenSSL's Configure (ports/openssl/README.md).
##
## The library is built through the SDK's compiler driver, sxcc, as static
## archives that link.sh turns into one shared library. Everything below the
## C library -- entropy, time -- comes from the program's runtime, so the same
## library serves SUN and POSIX programs.

my %targets = (
    "savanxp-x86_64" => {
        inherit_from     => [ "BASE_unix" ],
        CC               => "cc",
        cflags           => "",
        cppflags         => "-DOPENSSL_NO_SECURE_MEMORY",
        lib_cppflags     => "-DL_ENDIAN",
        sys_id           => "SAVANXP",
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        thread_scheme    => "(unknown)",
        dso_scheme       => "",
        perlasm_scheme   => "elf",
        shared_target    => "",
    },
);
