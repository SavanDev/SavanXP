timeout: 0
serial: yes
verbose: yes
default_entry: 1

# The development path's configuration: run, debug, the smokes and gpu-soak.
# It differs from boot/limine.conf (the ISO path's) in two ways.
#
# It does not load disk.img as a module. On the development path QEMU attaches
# build/disk.img as a disk (AHCI, IDE, NVMe or virtio-blk), and that is the
# real root. Limine's module would be registered as the "livecd" ramdisk, with
# priority 10, behind every disk driver, so mount_any would keep the disk and
# never mount the module. It would still cost: Limine loads it whole into RAM,
# the boot enumerates it as a second device, and the EFI tree has to carry the
# file, which runs into vvfat's FAT16 limit. The kernel does not depend on the
# module: build_boot_info() leaves disk_image_address null when it did not
# come, and kernel_main.cpp checks it before registering the ramdisk.
#
# Its command line carries `nvme-rw`: NVMe disks are read-only without it, and
# under SAVANXP_DISK_BUS=nvme the root is one (docs/kernel/NVME.md). Only QEMU
# boots this file.

/SavanXP
    comment: Kernel minimo freestanding sobre Limine x86_64 UEFI
    protocol: limine
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/initramfs.cpio
    resolution: 1280x800x32
    cmdline: boot=serial nvme-rw
