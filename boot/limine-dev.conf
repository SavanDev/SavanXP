timeout: 0
serial: yes
verbose: yes
default_entry: 1

# Config del camino de desarrollo: run, debug, smokes y gpu-soak. Es
# identica a boot/limine.conf (la del camino ISO) sin la linea que carga
# disk.img como modulo, y esa unica diferencia es el punto entero del archivo.
#
# En el camino de desarrollo QEMU adjunta build/disk.img como disco ATA o
# virtio-blk, y ese es el /disk de verdad. El modulo de Limine se registraria
# como ramdisk "livecd" con prioridad 10, por detras de ata (100) y virtio-blk
# (110), asi que mount_any se quedaria con el disco y el modulo no se montaria
# nunca. Cuesta lo que cuesta: Limine lo carga entero en RAM, el boot lo
# enumera como segundo device, y el arbol EFI tiene que llevar el archivo, lo
# que choca con el tope de FAT16 de vvfat.
#
# El kernel no depende del modulo: build_boot_info() deja disk_image_address en
# null cuando no vino, y kernel_main.cpp lo comprueba antes de registrar la
# ramdisk.

/SavanXP
    comment: Kernel minimo freestanding sobre Limine x86_64 UEFI
    protocol: limine
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/initramfs.cpio
    resolution: 1280x800x32
    cmdline: boot=serial
