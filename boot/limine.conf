timeout: 3
serial: yes
verbose: yes
default_entry: 1

# Config del camino ISO / LiveCD. Es la que carga el volumen persistente como
# modulo, porque en una ISO no hay disco adjunto y esa es la unica forma de que
# el sistema tenga /disk.
#
# El camino de desarrollo (run, debug, smokes, gpu-soak) usa en su lugar
# boot/limine-dev.conf, sin la linea del modulo. La razon esta en
# kernel_main.cpp: el modulo se registra como ramdisk "livecd" con prioridad
# 10, contra los 100 de ata y los 110 de virtio-blk, y fs::mount_any se queda
# con el primero que reclame. O sea que en el camino de desarrollo el modulo se
# carga entero en RAM, se enumera como segundo device, y nunca se monta porque
# el disco que QEMU adjunta ya esta montado. Peor: cargarlo obliga a meter
# disk.img en el arbol EFI, y QEMU monta ese arbol como FAT16, que no llega a
# 512 MiB.
#
# El kernel no depende del modulo: build_boot_info() deja disk_image_address en
# null si no vino, y kernel_main.cpp lo comprueba antes de llamar a
# ramdisk::attach_image.

# No `resolution:` line: Limine asks the monitor for its preferred mode
# (EDID) and falls back on its own when the firmware does not offer it. The
# kernel cannot change the mode after boot outside QEMU, so this is the mode
# for the whole session. The last entry forces 1024x768 for a machine where
# the monitor's mode does not light up.
/SavanXP
    comment: The monitor's preferred resolution
    protocol: limine
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/initramfs.cpio
    module_path: boot():/boot/disk.img
    cmdline: boot=serial

# On real hardware, where there is no serial port to read: the boot log on
# screen instead of the splash (`verbose`), and the same without USB
# (`nousb`) in case the xHCI driver is what stops a machine.
/SavanXP (boot log on screen)
    comment: The kernel's boot log on screen instead of the splash
    protocol: limine
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/initramfs.cpio
    module_path: boot():/boot/disk.img
    cmdline: boot=serial verbose

/SavanXP (no USB, boot log on screen)
    comment: The boot log on screen, with the USB controllers left alone
    protocol: limine
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/initramfs.cpio
    module_path: boot():/boot/disk.img
    cmdline: boot=serial verbose nousb

/SavanXP (1024x768)
    comment: A fixed 1024x768 mode, which every video BIOS offers
    protocol: limine
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/initramfs.cpio
    module_path: boot():/boot/disk.img
    resolution: 1024x768x32
    cmdline: boot=serial
