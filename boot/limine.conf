timeout: 0
serial: yes
verbose: yes
default_entry: 1

# Config del camino ISO / LiveCD. Es la que carga el volumen persistente como
# modulo, porque en una ISO no hay disco adjunto y esa es la unica forma de que
# el sistema tenga /disk.
#
# El camino de desarrollo (run, debug, smokes, gpu-soak) usa en su lugar
# boot/limine-dev.conf, sin la linea del modulo. La razon esta en
# kernel_main.cpp: el modulo se registra como ramdisk "livecd" con prioridad
# 10, contra los 100 de ata y los 110 de virtio-blk, y fs::mount_any se queda
# con el primero que reclame. O sea que en el camino de desarrollo el modulo se
# carga entero en RAM, se enumera como segundo device, y nunca se monta porque
# el disco que QEMU adjunta ya esta montado. Peor: cargarlo obliga a meter
# disk.img en el arbol EFI, y QEMU monta ese arbol como FAT16, que no llega a
# 512 MiB.
#
# El kernel no depende del modulo: build_boot_info() deja disk_image_address en
# null si no vino, y kernel_main.cpp lo comprueba antes de llamar a
# ramdisk::attach_image.

/SavanXP
    comment: Kernel minimo freestanding sobre Limine x86_64 UEFI
    protocol: limine
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/initramfs.cpio
    module_path: boot():/boot/disk.img
    resolution: 1280x800x32
    cmdline: boot=serial
