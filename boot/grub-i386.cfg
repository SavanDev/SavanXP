# GRUB2/Multiboot2 BIOS boot. Mirror diagnostics to COM1 and load the
# reference CPIO root as a module; /disk remains a separate persistent volume.
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set timeout=0
set default=0

# The optional Multiboot2 framebuffer tag requests the graphical mode.
# Keep GRUB output on serial/text for early boot diagnostics.

menuentry "SavanXP (i386, multiboot2)" {
    multiboot2 /boot/savanxp-kernel.elf
    module2 /boot/initramfs.cpio initramfs
    boot
}
