# GRUB2 + Multiboot2, el arranque del kernel i386 (docs/REAL_HARDWARE.md).
# El camino x86_64 sigue con Limine: este fichero solo lo lee el ISO i386
# (grub-mkrescue, plataforma i386-pc, BIOS puro).
#
# La consola de GRUB va tambien al puerto serie para que un fallo temprano
# (imagen que no carga, etiqueta mal formada) se vea en el log del test.
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set timeout=0
set default=0

menuentry "SavanXP (i386, multiboot2)" {
    multiboot2 /boot/savanxp-kernel.elf
    boot
}
