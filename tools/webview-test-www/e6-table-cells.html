<!DOCTYPE html>
<html>
<head>
<title>E6: table cells</title>
</head>
<body>
<p>A table with a border, cell padding and coloured cells:</p>
<table border="1" cellpadding="6" cellspacing="2">
<tr><td bgcolor="#ffffcc">north</td><td bgcolor="#ffffcc">south</td></tr>
<tr bgcolor="#ccffcc"><td>east</td><td>west</td></tr>
<tr><td colspan="2" align="center">wide cell</td></tr>
</table>
</body>
</html>
