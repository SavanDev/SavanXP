<!DOCTYPE html>
<html>
<head>
<title>E4 blocks</title>
<style>
#a { margin: 10px 20px; padding: 5px; border: 2px solid black; height: 30px }
#b { width: 200px; margin: 0 auto; height: 10px; background: silver }
#c { width: 50%; padding-left: 25%; height: 10px; margin-top: 15px; background: silver }
#d { margin-top: 20px }
#d1 { margin-top: 30px; margin-bottom: 5px; height: 10px; background: silver }
#d2 { margin: 12px 0 }
#d3 { margin-top: 4px; height: 10px; background: silver }
#f { margin-top: -4px; height: 20px; width: 100px; border: 1px solid; box-sizing: border-box }
#g { max-width: 300px; min-height: 20px; padding: 3px; background: silver }
#h { width: 100px; margin-left: 50px; margin-right: 50px; height: 5px; background: silver }
#i { border-top: 3px solid; margin-top: 6px }
#i1 { margin-top: 10px; height: 5px; background: silver }
#j { overflow: hidden }
#j1 { margin: 10px 0 7px; height: 5px; background: silver }
#k { height: 50% }
#k1 { height: 10px; background: silver }
#l { height: 40px }
#l1 { height: 50%; background: silver }
</style>
</head>
<body><div id="a"></div><div id="b"></div><div id="c"></div><div id="d"><div id="d1"></div><div id="d2"></div><div id="d3"></div></div><div id="f"></div><div id="g"></div><div id="h"></div><div id="i"><div id="i1"></div></div><div id="j"><div id="j1"></div></div><div id="k"><div id="k1"></div></div><div id="l"><div id="l1"></div></div></body>
</html>
