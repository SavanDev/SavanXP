# Iconos por tipo de archivo.
#
# Una linea `.ext=nombre-de-icono` por tipo. El nombre resuelve contra
# /disk/icons/<nombre>.sxicon, que el build emite desde
# assets/desktop/icons/mime/ con tools/gen_mime_icons.py.
#
# Esto vive en la imagen y no horneado en C a proposito: docs/SXE_FORMAT.md
# decide que el sistema no lleva una tabla central compilada de "que tipo es
# cada extension". Aca es un dato editable, del mismo orden que assoc.ini, y
# agregar un tipo es copiar dos PNG al catalogo y sumar una linea -- sin
# recompilar nada.
#
# Los nombres siguen la Icon Naming Specification de freedesktop, que es la
# misma que usan los sets de donde sale el arte. Mantenerla es lo que permite
# cambiar de origen de iconos sin reescribir este archivo.
#
# '#' y ';' abren comentario. Las claves sin punto inicial son las reservadas
# de abajo; cualquier otra clave tiene que empezar con '.'.

# --- reservadas -------------------------------------------------------------

# Directorios.
folder=folder
# Ejecutables, resueltos por el flag de lanzable y no por la extension: un
# programa sin extension igual tiene que mostrar el icono de programa.
program=application-x-executable
# Lo que no cae en ninguna regla. Sin esta linea, un tipo desconocido queda
# sin icono, que tambien es una respuesta valida.
default=text-x-generic

# --- texto ------------------------------------------------------------------

.txt=text-x-generic
.log=text-x-generic
.md=text-x-generic
.ini=text-x-generic
.cfg=text-x-generic
.c=text-x-script
.h=text-x-script
.sh=text-x-script
.py=text-x-script
.html=text-html
.htm=text-html

# --- documentos -------------------------------------------------------------

.doc=x-office-document
.rtf=x-office-document

# --- imagen, audio, video ---------------------------------------------------

.png=image-x-generic
.bmp=image-x-generic
.jpg=image-x-generic
.jpeg=image-x-generic
.gif=image-x-generic
.wav=audio-x-generic
.mp3=audio-x-generic
.ogg=audio-x-generic
.mjpeg=video-x-generic
.mp4=video-x-generic
.avi=video-x-generic
.mkv=video-x-generic

# --- binarios ---------------------------------------------------------------

.sxe=application-x-executable
.elf=application-x-executable
.wad=package-x-generic
.tar=package-x-generic
.gz=package-x-generic
.zip=package-x-generic
.img=package-x-generic
.ttf=font-x-generic
.hex=font-x-generic
