# Icons by file type.
#
# One line `.ext=icon-name` per type. The name resolves against
# /icons/<name>.sxicon, which the build emits from
# assets/desktop/icons/mime/ with tools/gen_mime_icons.py.
#
# This lives in the image and not baked into C on purpose: docs/userland/SXE_FORMAT.md
# decides that the system carries no central compiled table of "which type is
# each extension". Here it is editable data, of the same kind as assoc.ini, and
# adding a type is copying two PNGs into the catalog and adding a line --
# without recompiling anything.
#
# The names follow freedesktop's Icon Naming Specification, the same one the
# sets the art comes from use. Keeping to it is what allows changing the icon
# source without rewriting this file.
#
# '#' and ';' start a comment. Keys without a leading dot are the reserved ones
# below; any other key has to start with '.'.

# --- reservadas -------------------------------------------------------------

# Directorios.
folder=folder
# Ejecutables, resueltos por el flag de lanzable y no por la extension: un
# programa sin extension igual tiene que mostrar el icono de programa.
program=application-x-executable
# Lo que no cae en ninguna regla. Sin esta linea, un tipo desconocido queda
# sin icono, que tambien es una respuesta valida.
default=text-x-generic

# --- texto ------------------------------------------------------------------

.txt=text-x-generic
.log=text-x-generic
.md=text-x-generic
.ini=text-x-generic
.cfg=text-x-generic
.c=text-x-script
.h=text-x-script
.sh=text-x-script
.py=text-x-script
.html=text-html
.htm=text-html

# --- documentos -------------------------------------------------------------

.doc=x-office-document
.rtf=x-office-document

# --- imagen, audio, video ---------------------------------------------------

.png=image-x-generic
.bmp=image-x-generic
.jpg=image-x-generic
.jpeg=image-x-generic
.gif=image-x-generic
.wav=audio-x-generic
.mp3=audio-x-generic
.ogg=audio-x-generic
.oga=audio-x-generic
.opus=audio-x-generic
.flac=audio-x-generic
.m4a=audio-x-generic
.mjpeg=video-x-generic
.mp4=video-x-generic
.m4v=video-x-generic
.mov=video-x-generic
.avi=video-x-generic
.mkv=video-x-generic
.webm=video-x-generic
.ogv=video-x-generic
.mpg=video-x-generic
.ts=video-x-generic

# --- binarios ---------------------------------------------------------------

.sxe=application-x-executable
.elf=application-x-executable
.wad=package-x-generic
.tar=package-x-generic
.gz=package-x-generic
.zip=package-x-generic
.img=package-x-generic
.ttf=font-x-generic
.hex=font-x-generic
