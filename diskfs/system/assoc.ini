# System defaults: user Settings/assoc.ini overrides each action separately.
# A plain extension is Open; Edit is independent of Open capabilities.
.bmp=/system/imgview.sxe
.png=/system/imgview.sxe
.jpg=/system/imgview.sxe
.jpeg=/system/imgview.sxe
edit:.bmp=/bin/paint
edit:.png=/bin/paint
edit:.jpg=/bin/paint
edit:.jpeg=/bin/paint
